<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="42%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#241A12"/>
      <stop offset="55%" stop-color="#151009"/>
      <stop offset="100%" stop-color="#0D0A08"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6D79B"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#9A6A28"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed warm background (covers the maskable safe area) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Compass ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="14"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#F59E0B" stroke-opacity="0.16" stroke-width="2"/>

  <!-- Needle: north amber, south gray -->
  <polygon points="256,128 232,256 256,232 280,256" fill="#F59E0B"/>
  <polygon points="256,384 280,256 256,280 232,256" fill="#6B5A4A"/>

  <!-- Hub -->
  <circle cx="256" cy="256" r="16" fill="#0D0A08" stroke="url(#ring)" stroke-width="6"/>

  <!-- Cardinal ticks -->
  <line x1="256" y1="92" x2="256" y2="118" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
  <g stroke="#6B5A4A" stroke-width="5" stroke-linecap="round">
    <line x1="420" y1="256" x2="394" y2="256"/>
    <line x1="92" y1="256" x2="118" y2="256"/>
    <line x1="256" y1="420" x2="256" y2="394"/>
  </g>
</svg>
